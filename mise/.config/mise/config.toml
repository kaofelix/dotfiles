[settings]
idiomatic_version_file_enable_tools = ["node", "ruby"]
experimental = true
minimum_release_age_excludes = ["npm:@earendil-works/pi-coding-agent"]

[hooks]
postinstall = 'if [ -x "$HOME/.local/bin/update-zsh-completions" ]; then "$HOME/.local/bin/update-zsh-completions"; else echo "Skipping shell completions: helper not installed yet; run make shell-completions after stowing"; fi'

[tools]
ast-grep = "latest"
bat = "latest"
crush = "latest"
difftastic = "latest"
fd = "latest"
gh = "latest"
"github:can1357/oh-my-pi" = "latest"
"github:juanibiapina/gob" = "latest"
glow = "latest"
gum = "latest"
herdr = "latest"
jq = "latest"
maestro = "latest"
node = "lts"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@juanibiapina/browse-cli" = { version = "latest", allow_low_downloads = true }
"npm:glimpseui" = { version = "latest", allow_builds = ["glimpseui"] }
"npm:@metabase/cli" = "latest"
"npm:@posthog/cli" = "latest"
"npm:hunkdiff" = "latest"
prek = "latest"
ripgrep = "latest"
shellcheck = "latest"
usage = "latest"
